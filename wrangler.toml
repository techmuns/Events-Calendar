# Cloudflare Workers deploy configuration.
#
# Deploys the built Vite single-page app (the `dist/` folder produced by
# `npm run build`) as a static-assets Worker.
#
# IMPORTANT: `name` must match the Worker's name in your Cloudflare dashboard,
# otherwise `wrangler deploy` will target/create a different Worker. If your
# Worker is named something else, change the value below to match it.
name = "events-calendar"
compatibility_date = "2024-11-01"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
