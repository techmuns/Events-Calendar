# Cloudflare Workers deploy configuration.
#
# Full-stack Worker: `worker/index.ts` serves the /api routes (live NSE feed)
# and falls through to the built SPA in `dist/` (static assets) for everything
# else. `npm run build` produces dist/ before `wrangler deploy` runs.
#
# IMPORTANT: `name` must match the Worker's name in your Cloudflare dashboard,
# otherwise `wrangler deploy` will target/create a different Worker.
name = "events-calendar"
main = "worker/index.ts"
compatibility_date = "2024-11-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
